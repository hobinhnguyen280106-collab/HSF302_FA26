<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Dùng fragment commonHead truyền tiêu đề -->
    <th:block th:replace="~{fragments/layout :: commonHead('Kết quả sản phẩm')}"></th:block>
</head>
<body class="d-flex flex-column min-vh-100">

<!-- 1. Navbar chung, active tab sanpham -->
<div th:replace="~{fragments/layout :: navbar('sanpham')}"></div>

<main class="container py-4 flex-grow-1" style="max-width: 700px">
    <!-- Fragment thông báo alert hệ thống nếu có -->
    <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

    <!-- Flash message riêng của Controller: chỉ có ngay sau redirect -->
    <div th:if="${thongBao}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i><span th:text="${thongBao}">Thông báo</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>

    <h3 class="h5 mb-3">Danh sách hiện tại</h3>

    <ul class="list-group mb-3" th:unless="${#lists.isEmpty(danhSach)}">
        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="sp : ${danhSach}">
            <!-- |...| literal substitution: ghép chuỗi gọn hơn dùng + -->
            <span th:text="|${sp.ten} - ${#numbers.formatDecimal(sp.gia, 1, 'POINT', 0, 'COMMA')} VNĐ (SL: ${sp.soLuong})|">
                Tên - Giá (SL)
            </span>
        </li>
    </ul>

    <p th:if="${#lists.isEmpty(danhSach)}" class="text-muted">Chưa có sản phẩm.</p>

    <div class="mt-3">
        <a th:href="@{/sanpham/them}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Thêm tiếp
        </a>
    </div>
</main>

<!-- 2. Footer và Scripts dùng chung -->
<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
