<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Danh sách sinh viên</title>
</head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-people-fill me-2"></i>Danh sách sinh viên</h2>
        <a th:href="@{/students/create}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Thêm sinh viên
        </a>
    </div>

    <!-- Thanh tìm kiếm (giữ nguyên sortField và sortDir khi tìm) -->
    <div class="row mb-3">
        <div class="col-md-6">
            <form th:action="@{/students}" method="get" class="d-flex gap-2">
                <input type="hidden" name="sortField" th:value="${sortField}"/>
                <input type="hidden" name="sortDir" th:value="${sortDir}"/>

                <input type="text" name="keyword" th:value="${keyword}"
                       class="form-control" placeholder="Tìm theo tên hoặc email..."/>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-search"></i>
                </button>
                <a th:if="${keyword != null and !keyword.isBlank()}" th:href="@{/students}"
                   class="btn btn-outline-secondary" title="Xóa bộ lọc">
                    <i class="bi bi-x-lg"></i>
                </a>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">

            <!-- Khi danh sách trống -->
            <div th:if="${#lists.isEmpty(students)}" class="text-center p-5 text-muted">
                <i class="bi bi-inbox display-4"></i>
                <p class="mt-2">Không tìm thấy sinh viên nào.</p>
                <a th:href="@{/students/create}" class="btn btn-outline-primary">Thêm ngay</a>
            </div>

            <!-- Bảng dữ liệu có Sắp xếp theo cột -->
            <table th:unless="${#lists.isEmpty(students)}" class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <!-- Sort theo ID -->
                    <th>
                        <a class="text-white text-decoration-none"
                           th:href="@{/students(page=0, keyword=${keyword}, sortField='id', sortDir=${sortField == 'id' ? reverseSortDir : 'asc'})}">
                            ID <i class="bi" th:classappend="${sortField == 'id'} ? (${sortDir == 'asc'} ? 'bi-arrow-up' : 'bi-arrow-down') : 'bi-arrow-down-up'"></i>
                        </a>
                    </th>
                    <!-- Sort theo Tên -->
                    <th>
                        <a class="text-white text-decoration-none"
                           th:href="@{/students(page=0, keyword=${keyword}, sortField='name', sortDir=${sortField == 'name' ? reverseSortDir : 'asc'})}">
                            Họ tên <i class="bi" th:classappend="${sortField == 'name'} ? (${sortDir == 'asc'} ? 'bi-arrow-up' : 'bi-arrow-down') : 'bi-arrow-down-up'"></i>
                        </a>
                    </th>
                    <th>Email</th>
                    <th>Tuổi</th>
                    <th>Chuyên ngành</th>
                    <!-- Sort theo GPA -->
                    <th>
                        <a class="text-white text-decoration-none"
                           th:href="@{/students(page=0, keyword=${keyword}, sortField='gpa', sortDir=${sortField == 'gpa' ? reverseSortDir : 'asc'})}">
                            GPA <i class="bi" th:classappend="${sortField == 'gpa'} ? (${sortDir == 'asc'} ? 'bi-arrow-up' : 'bi-arrow-down') : 'bi-arrow-down-up'"></i>
                        </a>
                    </th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student, stat : ${students}">
                    <td th:text="${currentPage * 3 + stat.count}">1</td>
                    <td th:text="${student.id}">1</td>
                    <td>
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           th:text="${student.name}"
                           class="text-decoration-none fw-semibold">Tên</a>
                    </td>
                    <td th:text="${student.email}">email</td>
                    <td th:text="${student.age}">20</td>
                    <td><span class="badge bg-secondary" th:text="${student.major.code}">CNTT</span></td>

                    <td>
                        <span th:classappend="${student.gpa >= 3.5} ? 'gpa-high' :
                                              (${student.gpa >= 2.5} ? 'gpa-mid' : 'gpa-low')"
                              th:text="${#numbers.formatDecimal(student.gpa, 1, 1)}">3.5</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           class="btn btn-sm btn-outline-info me-1" title="Chi tiết">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/students/{id}/edit(id=${student.id})}"
                           class="btn btn-sm btn-outline-warning me-1" title="Sửa">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/students/{id}/delete(id=${student.id})}"
                              method="post" class="d-inline"
                              th:data-name="${student.name}"
                              onsubmit="return confirm('Xóa sinh viên ' + this.dataset.name + '?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Thanh phân trang (kèm theo sortField và sortDir khi chuyển trang) -->
    <nav th:if="${totalPages > 1}" class="mt-4" aria-label="Pagination">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/students(page=${currentPage - 1}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}">
                    Trước
                </a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link"
                   th:href="@{/students(page=${i}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}"
                   th:text="${i + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/students(page=${currentPage + 1}, keyword=${keyword}, sortField=${sortField}, sortDir=${sortDir})}">
                    Sau
                </a>
            </li>
        </ul>
    </nav>

    <!-- Thống kê tổng số -->
    <div class="text-muted text-center mt-2">
        <small>Hiển thị trang <strong th:text="${currentPage + 1}">1</strong> / <strong th:text="${totalPages}">1</strong>
            (Tổng số: <strong th:text="${totalItems}">0</strong> sinh viên)</small>
    </div>

</section>
</body>
</html>
