<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>500 - Lỗi máy chủ</title>
</head>
<body>
<section>
    <div class="row justify-content-center text-center py-5">
        <div class="col-md-8 col-lg-6">
            <div class="display-1 fw-bold text-danger mb-3">
                <i class="bi bi-x-octagon-fill"></i> 500
            </div>
            <h2 class="mb-3">Đã xảy ra sự cố hệ thống</h2>
            <p class="text-muted mb-4">
                Máy chủ gặp sự cố không mong muốn trong khi xử lý yêu cầu. Vui lòng thử lại sau giây lát.
            </p>

            <!-- Khối hiển thị thông tin debug (nếu có message) -->
            <div th:if="${message}" class="alert alert-secondary text-start mb-4">
                <small class="fw-semibold text-danger">Chi tiết lỗi:</small>
                <div class="small font-monospace mt-1" th:text="${message}">Lỗi hệ thống</div>
            </div>

            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/students}" class="btn btn-primary">
                    <i class="bi bi-arrow-clockwise me-1"></i> Về danh sách sinh viên
                </a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
